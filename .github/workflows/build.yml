# Каждый push и PR: clippy, тесты и universal .app + .dmg для macOS.
# Релизы здесь не публикуются: их собирает и загружает tools/release.sh с мака автора,
# потому что GitHub-раннеры macOS периодически недоступны часами. Тег v* проверяется
# этой же сборкой.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # arm64-раннер: universal .app собирается кросс-компиляцией x86_64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      - name: Собрать universal .app (arm64 + x86_64) и .dmg
        env:
          MACOS_UNIVERSAL: "1"
        run: |
          tools/make_app.sh
          tools/make_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/release/yamusic-rs-*.dmg

