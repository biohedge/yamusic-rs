# Каждый push и PR: clippy, тесты и .app + .dmg для macOS на Apple Silicon.
# Релизы здесь не публикуются: их собирает и загружает tools/release.sh с мака автора,
# потому что GitHub-раннеры macOS периодически недоступны часами. Тег v* проверяется
# этой же сборкой.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      - name: Собрать .app и .dmg для Apple Silicon
        env:
          MACOS_UNIVERSAL: "0"
          MACOS_TARGET: ""
        run: |
          test "$(uname -m)" = arm64
          tools/make_app.sh
          tools/make_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: target/release/yamusic-rs-*-macos-arm64.dmg
          if-no-files-found: error

