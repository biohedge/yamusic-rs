# Каждый push и PR: clippy, тесты и universal .app + .dmg для macOS.
# Тег v* (например v1.1.3): то же и релиз с одним файлом .dmg. Его создаёт отдельное
# задание после сборки. Встроенная обновлялка на macOS открывает страницу релиза.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # arm64-раннер: universal .app собирается кросс-компиляцией x86_64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      - name: Собрать universal .app (arm64 + x86_64) и .dmg
        env:
          MACOS_UNIVERSAL: "1"
        run: |
          tools/make_app.sh
          tools/make_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/release/yamusic-rs-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes
